<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <!--
    The pigeonhole argument: the unit square cut into four half-by-half cells,
    with the tight five-point configuration (four corners plus the centre).
    The dashed diagonal is the worst case, sqrt(2)/2.
  -->
  <!-- the cell that ends up holding two points -->
  <rect x="20" y="20" width="100" height="100" fill="#F2EFE4" />

  <!-- the unit square -->
  <rect x="20" y="20" width="200" height="200" fill="none" stroke="#15161C" stroke-width="2" />

  <!-- the two cuts -->
  <g stroke="#55564F" stroke-width="1" stroke-dasharray="5 4">
    <line x1="120" y1="20" x2="120" y2="220" />
    <line x1="20" y1="120" x2="220" y2="120" />
  </g>

  <!-- the worst-case distance inside one cell: its diagonal -->
  <line x1="20" y1="20" x2="120" y2="120" stroke="#FF3B2F" stroke-width="2" stroke-dasharray="6 4" />

  <!-- five points: the four corners and the centre -->
  <g fill="#FF3B2F" stroke="#15161C" stroke-width="1.5">
    <circle cx="20" cy="20" r="5" />
    <circle cx="220" cy="20" r="5" />
    <circle cx="20" cy="220" r="5" />
    <circle cx="220" cy="220" r="5" />
    <circle cx="120" cy="120" r="5" />
  </g>

  <text x="76" y="62" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="14" fill="#D62A20">
    &#8730;2&#8260;2
  </text>
</svg>
