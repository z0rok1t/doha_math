<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <!--
    The rearrangement proof of Pythagoras: four copies of the right triangle
    placed inside a square of side a+b, leaving a tilted square of side c.
    Legs are 80 and 120, so c = sqrt(80^2 + 120^2).
    Colours are the "The Studio" palette; this file is a static asset, so the
    values are literal rather than tokens.
  -->
  <g fill="none" stroke="#15161C" stroke-width="2" stroke-linejoin="round">
    <!-- the outer square, side a + b -->
    <rect x="20" y="20" width="200" height="200" fill="#FBFAF5" />

    <!-- four congruent right triangles, one against each edge -->
    <g fill="#F2EFE4" stroke-width="1.5">
      <polygon points="20,20 100,20 20,140" />
      <polygon points="220,20 220,100 100,20" />
      <polygon points="220,220 140,220 220,100" />
      <polygon points="20,220 20,140 140,220" />
    </g>

    <!-- the hole they leave: a square on the hypotenuse -->
    <polygon points="100,20 220,100 140,220 20,140" fill="#FFFFFF" stroke="#FF3B2F" stroke-width="2" />
  </g>

  <g font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="15" fill="#15161C">
    <text x="60" y="14" text-anchor="middle">a</text>
    <text x="160" y="14" text-anchor="middle">b</text>
    <text x="120" y="125" text-anchor="middle" fill="#D62A20">c</text>
  </g>
</svg>
